name: Update feed

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (off the hour, when GitHub's scheduler is less busy)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scraper/main.py

      - name: Commit if changed
        run: |
          git add site/data scraper/state.json
          if git diff --staged --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "ai-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update feed $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
